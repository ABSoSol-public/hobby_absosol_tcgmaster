# Security-Header für die vom Frontend-nginx selbst ausgelieferten Seiten
# (HTML/JS/CSS). Die API-Antworten bekommen ihre Header vom Backend (@fastify/helmet).
# Per `include` in jeder Location mit eigenem add_header nötig, da nginx
# add_header-Direktiven nicht in Locations vererbt, die selbst welche setzen.
#
# Bewusst KEINE Skript-/Style-CSP: der Foto-Scan (tesseract.js) lädt Worker,
# WASM-Kern und Sprachdaten zur Laufzeit von externen CDNs (Blob-Worker); eine
# strikte script-src würde ihn brechen. frame-ancestors/base-uri/object-src
# schließen Clickjacking und Base-Tag-/Plugin-Angriffe ohne diese Nebenwirkung.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Leerer Wert (= Header entfällt) bei HTTP, siehe map in default.conf.template.
add_header Strict-Transport-Security $hsts_header always;
